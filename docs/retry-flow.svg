<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo da POC de retry HTTP em memoria</title>
  <desc id="desc">Uma requisicao passa pelo servidor Quick, tenta o destino usando req e, em caso de erro temporario, entra em uma fila limitada processada por workers.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#e5edf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315b78"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16804b"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd6b16"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#background)"/>
  <text x="60" y="66" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">POC de retry HTTP em memoria</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="16" fill="#49677d">Tentativa inicial sincrona, fila limitada, worker pool e janela maxima</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="210" height="110" rx="16" fill="#ffffff" stroke="#78a1bb" stroke-width="2"/>
    <rect x="330" y="170" width="210" height="110" rx="16" fill="#ffffff" stroke="#78a1bb" stroke-width="2"/>
    <rect x="600" y="170" width="230" height="110" rx="16" fill="#ffffff" stroke="#78a1bb" stroke-width="2"/>
    <rect x="900" y="170" width="240" height="110" rx="16" fill="#ffffff" stroke="#78a1bb" stroke-width="2"/>
    <rect x="350" y="445" width="220" height="110" rx="16" fill="#fff9ed" stroke="#d99a42" stroke-width="2"/>
    <rect x="650" y="445" width="220" height="110" rx="16" fill="#fff9ed" stroke="#d99a42" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="165" y="212" font-size="21" font-weight="700" fill="#17324d">Cliente</text>
    <text x="165" y="242" font-size="16" fill="#49677d">POST /dispatch</text>
    <text x="435" y="212" font-size="21" font-weight="700" fill="#17324d">quick</text>
    <text x="435" y="242" font-size="16" fill="#49677d">handler HTTP</text>
    <text x="715" y="212" font-size="21" font-weight="700" fill="#17324d">req</text>
    <text x="715" y="242" font-size="16" fill="#49677d">tentativa inicial</text>
    <text x="1020" y="212" font-size="21" font-weight="700" fill="#17324d">Destino</text>
    <text x="1020" y="242" font-size="16" fill="#49677d">JSON + resposta HTTP</text>
    <text x="460" y="487" font-size="21" font-weight="700" fill="#8b5415">Fila limitada</text>
    <text x="460" y="517" font-size="16" fill="#8b5415">buffer em memoria</text>
    <text x="760" y="487" font-size="21" font-weight="700" fill="#8b5415">Worker pool</text>
    <text x="760" y="517" font-size="16" fill="#8b5415">backoff + janela</text>
  </g>

  <path d="M270 225 H330" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 225 H600" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M830 225 H900" fill="none" stroke="#315b78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="865" y="208" font-family="Arial, sans-serif" font-size="14" fill="#315b78" text-anchor="middle">request</text>

  <path d="M715 280 V360 H460 V445" fill="none" stroke="#bd6b16" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <text x="575" y="348" font-family="Arial, sans-serif" font-size="15" fill="#8b5415" text-anchor="middle">500, 502, 503, 504, 429 ou transporte</text>

  <path d="M570 500 H650" fill="none" stroke="#bd6b16" stroke-width="3" marker-end="url(#orangeArrow)"/>
  <path d="M760 445 V360 H1020 V280" fill="none" stroke="#16804b" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text x="900" y="348" font-family="Arial, sans-serif" font-size="15" fill="#16804b" text-anchor="middle">retry com mesmo payload e request id</text>

  <path d="M1020 280 V625 H435 V555" fill="none" stroke="#bd6b16" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#orangeArrow)"/>
  <text x="770" y="612" font-family="Arial, sans-serif" font-size="15" fill="#8b5415" text-anchor="middle">falha retryable: volta ao worker ate sucesso ou expiracao</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="445" width="230" height="110" rx="16" fill="#eaf7ef" stroke="#51a878" stroke-width="2"/>
    <text x="175" y="487" text-anchor="middle" font-size="20" font-weight="700" fill="#14683d">202 Accepted</text>
    <text x="175" y="517" text-anchor="middle" font-size="15" fill="#256b48">quando entra na fila</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#49677d">
    <text x="60" y="680">A fila e volatil: reiniciar o processo perde tarefas pendentes.</text>
    <text x="1140" y="680" text-anchor="end">Idempotencia continua sendo responsabilidade do destino.</text>
  </g>
</svg>
